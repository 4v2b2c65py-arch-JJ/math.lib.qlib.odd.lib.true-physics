[package]
name = "mathlib"
version = "0.1.0"
edition = "2024"

[lib]
name = "mathlib"
path = "src/lib.rs"

[[bin]]
name = "mathlib_bench"
path = "src/bin/bench.rs"

[dependencies]

[package.metadata.query]
field = "elements"
scope = "earth"
sets = ["periodic_table_all"]
count = 118
description = "Query field for Cargo using all available element sets on Earth (periodic table elements 1-118)."
